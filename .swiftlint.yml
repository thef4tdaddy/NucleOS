excluded:
  - .build
  - DerivedData
  - NucleOS.xcodeproj

opt_in_rules:
  - force_unwrapping
  - force_cast
  - empty_count

analyzer_rules:
  - unused_import

line_length:
  warning: 120
  error: 150

file_length:
  warning: 400
  error: 500

function_body_length:
  warning: 50
  error: 80

type_body_length:
  warning: 200
  error: 300

cyclomatic_complexity:
  warning: 10
  error: 15
