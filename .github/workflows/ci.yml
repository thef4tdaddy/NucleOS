name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: write

jobs:
  build:
    name: Build
    runs-on: macos-15
    outputs:
      status: ${{ steps.build.outputs.status }}
      errors: ${{ steps.build.outputs.errors }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Clear SwiftPM caches
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          rm -rf DerivedData

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project NucleOS.xcodeproj \
            -scheme NucleOS

      - name: Build
        id: build
        shell: bash
        run: |
          set +e
          xcodebuild \
            -project NucleOS.xcodeproj \
            -scheme NucleOS \
            -destination 'platform=macOS' \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_EXIT" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "errors=" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            ERRORS=$(grep "error:" build.log | head -20 | sed 's/"/\\\\"/g' || true)
            echo "errors<<EOF" >> "$GITHUB_OUTPUT"
            echo "$ERRORS" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

          exit "$BUILD_EXIT"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  test:
    name: Test
    runs-on: macos-15
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Clear SwiftPM caches
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          rm -rf DerivedData

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project NucleOS.xcodeproj \
            -scheme NucleOS

      - name: Run tests with coverage
        run: |
          xcodebuild test \
            -project NucleOS.xcodeproj \
            -scheme NucleOS \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log
          exit ${PIPESTATUS[0]}
      
      - name: Debug coverage paths
        if: always()
        run: |
          echo "=== PROFData files ==="
          find DerivedData -name '*.profdata' -type f

          echo "=== App bundles ==="
          find DerivedData -name 'NucleOS.app' -type d

          echo "=== Executables named NucleOS ==="
          find DerivedData -type f -name 'NucleOS' | grep -v '\.dSYM' || true

      - name: Convert coverage to lcov
        if: always()
        run: |
          PROF=$(find DerivedData -name '*.profdata' 2>/dev/null | head -1)
          BIN=$(find DerivedData -name 'NucleOS' -type f 2>/dev/null | grep -v '\.dSYM' | head -1)
          if [ -n "$PROF" ] && [ -n "$BIN" ]; then
            xcrun llvm-cov export \
              -format=lcov \
              -instr-profile="$PROF" \
              "$BIN" > coverage.lcov
            echo "✅ Coverage generated"
            head -10 coverage.lcov
          else
            echo "❌ Coverage files not found"
            touch coverage.lcov
          fi

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage.lcov
          flags: unittests
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test.log
            TestResults.xcresult
            coverage.lcov

  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.lint.outputs.status }}
      violations: ${{ steps.lint.outputs.violations }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SwiftLint
        id: lint
        run: |
          set +e
          docker run \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/realm/swiftlint:latest \
            swiftlint --reporter json > swiftlint.json 2>&1
          LINT_EXIT=$?
          set -e

          if [ $LINT_EXIT -eq 0 ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "violations=" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            VIOLATIONS=$(cat swiftlint.json | python3 -c "import json, sys; data = json.load(sys.stdin); [print(f'{v[\"file\"].split(\"/\")[-1]}:{v[\"line\"]} — {v[\"reason\"]} ({v[\"severity\"]})') for v in data[:20]]" 2>/dev/null || echo "See artifacts for details")
            echo "violations<<EOF" >> $GITHUB_OUTPUT
            echo "$VIOLATIONS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Upload SwiftLint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiftlint-report
          path: swiftlint.json

  comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: [build, test, swiftlint]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Find existing comment
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: NucleOS CI Report

      - name: Post or update PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## NucleOS CI Report

            | Check | Status |
            |-------|--------|
            | Build | ${{ needs.build.outputs.status == 'success' && '✅ Passed' || '❌ Failed' }} |
            | Test | ${{ needs.test.result == 'success' && '✅ Passed' || needs.test.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |
            | SwiftLint | ${{ needs.swiftlint.outputs.status == 'success' && '✅ Clean' || '⚠️ Violations found' }} |

            ${{ needs.build.outputs.status == 'failure' && format('### ❌ Build Errors\n```\n{0}\n```', needs.build.outputs.errors) || '' }}

            ${{ needs.swiftlint.outputs.status == 'failure' && format('### ⚠️ SwiftLint Violations\n```\n{0}\n```', needs.swiftlint.outputs.violations) || '' }}

            ${{ needs.build.outputs.status == 'success' && needs.swiftlint.outputs.status == 'success' && '**All checks passed — ready to merge! 🚀**' || '**Review the issues above before merging.**' }}

            > Full logs available in [Actions artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Add label on lint failure
        if: needs.swiftlint.outputs.status == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['lint-issues']
            })

      - name: Add label on build failure
        if: needs.build.outputs.status == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['build-failed']
            })

      - name: Remove lint label on success
        if: needs.swiftlint.outputs.status == 'success'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            github.rest.issues.removeLabel({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'lint-issues'
            })

      - name: Remove build label on success
        if: needs.build.outputs.status == 'success'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            github.rest.issues.removeLabel({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'build-failed'
            })