name: Stale

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been inactive for 60 days.
            It will be closed in 14 days unless there is new activity.
          stale-pr-message: >
            This PR has been inactive for 30 days.
            It will be closed in 7 days unless there is new activity.
          close-issue-message: >
            Closed due to inactivity. Reopen if still relevant.
          close-pr-message: >
            Closed due to inactivity. Reopen if still relevant.
          stale-issue-label: 'wontfix'
          stale-pr-label: 'wontfix'
          exempt-issue-labels: 'epic,roadmap,blocked,pinned'
          exempt-pr-labels: 'blocked'
          days-before-issue-stale: 23
          days-before-pr-stale: 30
          days-before-issue-close: 7
          days-before-pr-close: 7
