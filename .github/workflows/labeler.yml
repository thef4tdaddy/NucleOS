name: Smart Labeler

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issues:
    types: [opened, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label-pr:
    name: Label PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Label by changed files
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

      - name: Label by PR title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title.toLowerCase();
            const labels = [];

            // Conventional commit type
            if (title.startsWith('feat'))     labels.push('feature');
            if (title.startsWith('fix'))      labels.push('bug');
            if (title.startsWith('docs'))     labels.push('documentation');
            if (title.startsWith('style'))    labels.push('design');
            if (title.startsWith('refactor')) labels.push('architecture');
            if (title.startsWith('chore'))    labels.push('developer-experience');
            if (title.startsWith('perf'))     labels.push('enhancement');

            // Scope detection
            if (title.includes('(dashboard)'))  labels.push('dashboard');
            if (title.includes('(health)'))     labels.push('health');
            if (title.includes('(calendar)'))   labels.push('calendar');
            if (title.includes('(tasks)'))      labels.push('tasks');
            if (title.includes('(ai)'))         labels.push('ai');
            if (title.includes('(menubar)'))    labels.push('menubar');
            if (title.includes('(sidebar)'))    labels.push('ui');
            if (title.includes('(cloudkit)'))   labels.push('cloudkit');
            if (title.includes('(eventkit)'))   labels.push('eventkit');
            if (title.includes('(healthkit)'))  labels.push('healthkit');
            if (title.includes('(mlx)'))        labels.push('mlx');
            if (title.includes('(groq)'))       labels.push('groq');
            if (title.includes('(anthropic)'))  labels.push('anthropic');
            if (title.includes('(openai)'))     labels.push('openai');
            if (title.includes('(ci)'))         labels.push('devops');
            if (title.includes('(permissions)')) labels.push('permissions');
            if (title.includes('(keychain)'))   labels.push('settings');
            if (title.includes('(sync)'))       labels.push('sync');

            // Agent task detection
            if (title.includes('[agent]') || title.includes('agent:')) {
              labels.push('agent: nucleos');
            }

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: [...new Set(labels)]
              });
            }

  label-issue:
    name: Label Issue
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'
    steps:
      - name: Label by issue title and body
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const body = (context.payload.issue.body || '').toLowerCase();
            const text = title + ' ' + body;
            const labels = [];

            // Type detection from title prefix
            if (title.startsWith('[bug]') || title.startsWith('bug:'))           labels.push('bug');
            if (title.startsWith('[feat]') || title.startsWith('feat:'))         labels.push('feature');
            if (title.startsWith('[epic]'))                                       labels.push('epic');
            if (title.startsWith('[devops]'))                                     labels.push('devops');
            if (title.startsWith('[docs]'))                                       labels.push('documentation');
            if (title.startsWith('[research]'))                                   labels.push('research');
            if (title.startsWith('[agent]'))                                      labels.push('agent: nucleos');

            // Area detection from content
            if (text.includes('dashboard'))                   labels.push('dashboard');
            if (text.includes('healthkit') || text.includes('health kit'))        labels.push('healthkit');
            if (text.includes('eventkit') || text.includes('event kit'))          labels.push('eventkit');
            if (text.includes('cloudkit') || text.includes('cloud kit'))          labels.push('cloudkit');
            if (text.includes('reminders') || text.includes('tasks'))            labels.push('tasks');
            if (text.includes('calendar'))                    labels.push('calendar');
            if (text.includes('menu bar') || text.includes('menubar'))           labels.push('menubar');
            if (text.includes('mlx') || text.includes('phi-3') || text.includes('on-device')) labels.push('mlx');
            if (text.includes('groq'))                        labels.push('groq');
            if (text.includes('anthropic') || text.includes('claude'))           labels.push('anthropic');
            if (text.includes('openai') || text.includes('gpt'))                 labels.push('openai');
            if (text.includes('family sharing') || text.includes('cloudkit'))    labels.push('family');
            if (text.includes('permission') || text.includes('entitlement'))     labels.push('permissions');
            if (text.includes('design') || text.includes('color') || text.includes('ui')) labels.push('design');
            if (text.includes('sync'))                        labels.push('sync');
            if (text.includes('settings') || text.includes('keychain'))          labels.push('settings');
            if (text.includes('swiftlint') || text.includes('ci') || text.includes('github actions')) labels.push('devops');
            if (text.includes('health') && !text.includes('healthkit'))          labels.push('health');
            if (text.includes('ai') || text.includes('llm') || text.includes('briefing')) labels.push('ai');

            // Roadmap issues
            if (title.startsWith('epic:') || text.includes('roadmap'))           labels.push('roadmap');

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: [...new Set(labels)]
              });
            }
