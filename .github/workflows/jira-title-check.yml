name: Jira Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  issues: write

jobs:
  check-title:
    name: PR Title contains NUC-#
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        id: validate
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$PR_TITLE" | grep -qE 'NUC-[0-9]+'; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find existing Jira check comment
        id: find-comment
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: <!-- jira-title-check -->

      - name: Post failure comment
        if: steps.validate.outputs.valid == 'false'
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- jira-title-check -->
            ## ❌ Missing Jira Issue Reference

            This PR title does not contain a Jira ticket reference in the required format.

            **Required format:** `NUC-<number>` somewhere in the title
            **Examples:**
            - `feat(dashboard): NUC-42 add health strip`
            - `NUC-123 fix calendar event layout`

            Please update the PR title to include the relevant `NUC-#` reference so this work can be tracked in Jira.

      - name: Delete resolved comment
        if: steps.validate.outputs.valid == 'true' && steps.find-comment.outputs.comment-id != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.issues.deleteComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ steps.find-comment.outputs.comment-id }}
            })

      - name: Fail if title is invalid
        if: steps.validate.outputs.valid == 'false'
        run: |
          echo "❌ PR title must contain NUC-<number> (e.g. NUC-42)"
          exit 1
